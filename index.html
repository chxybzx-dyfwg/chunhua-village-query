<style>
  :root{
    --bg:#F5F2EB;
    --card:#FFFFFF;
    --ink:#24211B;
    --muted:#6C675C;
    --line:#E4E0D5;
    --line-strong:#CFC9BA;
    --brand:#14534F;
    --brand-deep:#0D3F3C;
    --brand-soft:#E5EFED;
    --accent:#A85C14;
    --accent-soft:#F8EDDF;
    --ok:#1E6B4F;
    --warn:#A85C14;
    --radius:10px;

  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  body{
    background:linear-gradient(180deg,#E9EFEB 0%,var(--bg) 300px);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    min-height:100vh;
  }
  ::selection{background:var(--brand);color:#fff;}
  .wrap{max-width:1060px;margin:0 auto;padding:20px 16px 48px;}

  /* ===== 顶部 ===== */
  .topbar{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{flex:0 0 auto;width:44px;height:44px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(13,63,60,.28);}
  .brand h1{font-size:21px;line-height:1.3;font-weight:800;letter-spacing:.8px;white-space:nowrap;}
  .brand p{font-size:13px;color:var(--muted);margin-top:2px;}
  .stats{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:flex;align-items:baseline;gap:6px;background:var(--brand-soft);
    border:1px solid #D5E1DE;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);
  }
  .chip b{font-size:16px;color:var(--brand-deep);font-weight:800;font-variant-numeric:tabular-nums;}

  /* ===== 搜索卡片 ===== */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .search-row{display:flex;flex-direction:column;gap:10px;}
  .search-box{position:relative;flex:1;}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);}
  #q{
    width:100%;height:50px;border:1.5px solid var(--line-strong);border-radius:10px;
    padding:0 14px 0 42px;font-size:16px;color:var(--ink);background:#FCFBF8;
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  #q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,83,79,.14);background:#fff;}
  #q::placeholder{color:#9B968A;}
  .search-actions{display:flex;gap:10px;}
  .btn{
    height:50px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
    padding:0 22px;transition:background .15s;
  }
  .btn-primary{background:var(--brand);color:#fff;flex:1;box-shadow:0 2px 10px rgba(20,83,79,.28);}
  .btn-primary:hover{background:var(--brand-deep);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .hint kbd{background:var(--brand-soft);color:var(--brand-deep);border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit;}

  /* ===== 筛选 ===== */
  .filters{display:flex;flex-direction:column;gap:10px;}
  .filters .row{display:flex;flex-direction:column;gap:8px;}
  .filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  select{
    width:100%;height:40px;border:1.5px solid var(--line-strong);border-radius:10px;background:#FCFBF8;
    padding:0 10px;font-size:15px;color:var(--ink);outline:none;
  }
  select:focus{border-color:var(--brand);}
  .btn:focus-visible,select:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .filters .reset{margin-top:2px;}
  .filters .reset button{
    height:40px;border:1.5px solid var(--line-strong);border-radius:10px;background:#fff;color:var(--muted);
    font-size:14px;cursor:pointer;padding:0 16px;width:100%;
  }
  .filters .reset button:hover{border-color:var(--accent);color:var(--accent);}

  /* ===== 结果摘要 ===== */
  .summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 0 12px;font-size:13.5px;color:var(--muted);}
  .summary .count{color:var(--brand-deep);font-weight:800;font-size:15px;}
  .summary .divider{width:1px;height:14px;background:var(--line-strong);}
  .summary .filter-tag{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    border-radius:999px;padding:2px 10px;font-size:12.5px;
  }
  .summary .filter-tag button{
    border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;line-height:1;padding:2px;
  }

  /* ===== 结果表格 ===== */
  .table-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll::-webkit-scrollbar{height:8px;}
  .table-scroll::-webkit-scrollbar-thumb{background:#C9C4B6;border-radius:4px;}
  .table-scroll::-webkit-scrollbar-track{background:transparent;}
  table{border-collapse:collapse;table-layout:fixed;min-width:844px;margin:0 auto;}
  colgroup col:nth-child(1){width:110px;}
  colgroup col:nth-child(2){width:132px;}
  colgroup col:nth-child(3){width:192px;}
  colgroup col:nth-child(4){width:108px;}
  colgroup col:nth-child(5){width:166px;}
  colgroup col:nth-child(6){width:136px;}
  thead th{
    position:sticky;top:0;background:var(--brand);color:#FFFFFF;font-size:13px;font-weight:600;
    text-align:left;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.16);white-space:nowrap;
    letter-spacing:.4px;
  }
  tbody td{
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top;
    word-break:break-all;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even) td{background:#FAF9F4;}
  tbody tr:hover td{background:#F3F1E9;}
  td.name{font-weight:700;color:var(--ink);}
  td.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#3D5A57;font-variant-numeric:tabular-nums;white-space:nowrap;}
  td.path{color:#33302A;}
  mark{background:transparent;color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);}
  .badge-dup{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;}

  /* ===== 空态 ===== */
  .empty{padding:44px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:42px;height:42px;stroke:#C4D2CE;margin-bottom:12px;}
  .empty h3{font-size:15px;color:#4A463D;margin-bottom:6px;font-weight:600;}
  .empty p{font-size:13.5px;}

  footer{margin-top:22px;font-size:12px;color:#97917F;text-align:center;line-height:1.7;}
  footer b{color:#6C675C;font-weight:600;}

  @media (max-width:767px){
    .wrap{padding:14px 12px 36px;}
    .topbar{gap:12px;margin-bottom:14px;}

    .btn-primary{flex:0 0 auto;width:116px;}
    select{height:44px;}
    .filters .reset{display:flex;justify-content:flex-end;}

    .table-card{border-radius:14px;}
    thead th{padding:10px 12px;font-size:12.5px;}
    tbody td{padding:9px 12px;font-size:13.5px;}
    .summary{font-size:13px;margin:2px 0 10px;}

    select{width:auto;min-width:200px;}
    .filters .reset{margin-left:auto;}
    .filters .reset button{width:auto;}
  }
  @media (prefers-reduced-motion:reduce){

  }
</style>

/* ===== 工具函数 ===== */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function mark(s, terms){
  let html = esc(s);
  terms.forEach(function(t){
    if(!t) return;
    html = html.split(t).join('<mark>' + t + '</mark>');
  });
  return html;
}
function norm(s){ return String(s).toLowerCase(); }

/* ===== 状态 ===== */
let state = { query:'', newTown:'', oldTown:'', village:'' };

/* ===== 视图 ===== */
const $ = function(id){ return document.getElementById(id); };
const tbody = $('tbody'), empty = $('empty'), emptyMsg = $('emptyMsg');

function buildTowns(){
  const newSet = {}, oldSet = {}, villageSet = {};
  RAW_DATA.forEach(function(r){
    if(r.newTown) newSet[r.newTown] = 1;
    if(r.oldTown) oldSet[r.oldTown] = 1;
    if(r.village) villageSet[r.village] = 1;
  });
  fillSelect($('fNew'), Object.keys(newSet).sort());
  fillSelect($('fOld'), Object.keys(oldSet).sort());
  fillSelect($('fVillage'), Object.keys(villageSet).sort());
}
function fillSelect(sel, items){
  sel.innerHTML = '<option value="">全部</option>' + items.map(function(v){
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
  }).join('');
}

function getFiltered(){
  const terms = state.query.split(/\s+/).filter(Boolean).map(norm);
  return RAW_DATA.filter(function(r){
    if(state.newTown && r.newTown !== state.newTown) return false;
    if(state.oldTown && r.oldTown !== state.oldTown) return false;
    if(state.village && r.village !== state.village) return false;
    if(terms.length){
      const hay = norm(r.name) + ' ' + norm(r.village);
      return terms.every(function(t){ return hay.indexOf(t) !== -1; });
    }
    return true;
  });
}

function renderTop(){
  const towns = {};
  RAW_DATA.forEach(function(r){ if(r.newTown) towns[r.newTown] = 1; });
  const villages = {};
  RAW_DATA.forEach(function(r){ if(r.village) villages[r.village] = 1; });
  $('statsTop').innerHTML =
    '<span class="chip">自然村总数 <b>' + RAW_DATA.length + '</b></span>' +
    '<span class="chip">涉及新镇办 <b>' + Object.keys(towns).length + '</b></span>' +
    '<span class="chip">村委会+社区 <b>128</b></span>';
  $('footTotal').textContent = RAW_DATA.length;
}

function render(){
  const rows = getFiltered();
  const count = rows.length;

  /* 摘要 */
  const parts = ['<span>匹配 <span class="count">' + count + '</span> 条</span>'];
  if(state.newTown) parts.push('<span class="filter-tag">新镇办：' + esc(state.newTown) + '<button data-clear="newTown" aria-label="移除新镇筛选">×</button></span>');
  if(state.oldTown) parts.push('<span class="filter-tag">旧镇办：' + esc(state.oldTown) + '<button data-clear="oldTown" aria-label="移除旧镇筛选">×</button></span>');
  if(state.village) parts.push('<span class="filter-tag">村委会：' + esc(state.village) + '<button data-clear="village" aria-label="移除村委会筛选">×</button></span>');
  $('summary').innerHTML = parts.join('<span class="divider"></span>');

  /* 表格 */
  tbody.innerHTML = rows.map(function(r){
    const terms = state.query.split(/\s+/).filter(Boolean);
    return '<tr>' +
      '<td class="name">' + mark(r.name, terms) + '</td>' +
      '<td class="code">' + esc(r.code) + '</td>' +
      '<td class="path">' + esc(r.path) + '</td>' +
      '<td>' + esc(r.newTown) + '</td>' +
      '<td>' + esc(r.oldTown) + '</td>' +
      '<td>' + esc(r.village) + '</td>' +
    '</tr>';
  }).join('');

  empty.hidden = count !== 0;
  emptyMsg.textContent = state.query || state.newTown || state.oldTown || state.village
    ? '未找到与当前条件匹配的自然村，请调整关键词或筛选条件'
    : '暂无数据';
}

/* ===== 事件 ===== */
let timer = null;
function onInput(){
  clearTimeout(timer);
  timer = setTimeout(function(){ state.query = $('q').value.trim(); render(); }, 200);
}
$('q').addEventListener('input', onInput);
$('q').addEventListener('search', function(){ state.query = this.value.trim(); render(); });
$('btnSearch').addEventListener('click', function(){ state.query = $('q').value.trim(); render(); });
$('fNew').addEventListener('change', function(){ state.newTown = this.value; render(); });
$('fOld').addEventListener('change', function(){ state.oldTown = this.value; render(); });
$('fVillage').addEventListener('change', function(){ state.village = this.value; render(); });
$('btnReset').addEventListener('click', function(){
  state = { query:'', newTown:'', oldTown:'', village:'' };
  $('q').value = '';
  $('fNew').value = '';
  $('fOld').value = '';
  $('fVillage').value = '';
  render();
});
$('summary').addEventListener('click', function(e){
  const btn = e.target.closest('[data-clear]');
  if(!btn) return;
  state[btn.getAttribute('data-clear')] = '';
  if(btn.getAttribute('data-clear') === 'newTown') $('fNew').value = '';
  if(btn.getAttribute('data-clear') === 'oldTown') $('fOld').value = '';
  if(btn.getAttribute('data-clear') === 'village') $('fVillage').value = '';
  render();
});

/* ===== 初始化 ===== */
buildTowns();
renderTop();
render();
</script>
</body>
</html>
